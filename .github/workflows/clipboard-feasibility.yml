name: Clipboard feasibility

on:
  push:
    paths:
      - 'support/clipboard_sync/**'
      - '.github/workflows/clipboard-feasibility.yml'
  pull_request:
    paths:
      - 'support/clipboard_sync/**'
      - '.github/workflows/clipboard-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wayland-protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test read-only registry protocol
        run: python3 -m unittest discover -s support/clipboard_sync/feasibility/wayland -v

  android-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy tools package requested by v3's default.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install standalone probe SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build, unit-test and lint standalone probe
        working-directory: support/clipboard_sync/feasibility/android
        run: sh ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
      # Physical clipboard/lifecycle evidence is intentionally not claimed by CI.
